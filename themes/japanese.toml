# =============================================================================
# themes/japanese_urban.toml — Japanese Urban Fantasy theme for history_engine.
#
# Inspired by the "esper city" genre (e.g. A Certain Scientific Railgun,
# A Certain Magical Index). A modern Japanese prefecture-scale city dominated
# by research institutions, esper development programs, and the infrastructure
# that supports them. Schools, military bases, and covert agencies compete
# for influence across a dense urban and suburban landscape.
#
# Loaded by worldgen.py via load_theme("japanese_urban").
# Adding a new theme requires only creating a new file here — no code changes.
#
# Sections:
#   [names]              — syllable pools for algorithmic name generation
#   [features]           — terrain / landmark / modifier pools
#   [features.exclusions]— incompatible (category, value, category, value) pairs
#   [features.capital]   — guaranteed landmark for capital nodes
#   [resources]          — resource names and maximum quantities per node
#                          *** PLACEHOLDER — adjust to taste ***
# =============================================================================


# =============================================================================
# NAME GENERATION
#
# Names are built by concatenating syllables:
#   prefix + middle (0–1) + suffix
#
# Syllables follow Japanese kanji-compound romanization conventions.
# Prefixes are meaningful directional or descriptive stems (e.g. Shin = new,
# Kita = north, Shiro = white/castle). Middles are connective particles or
# linking vowels common in Japanese place names. Suffixes are geographic or
# civic suffixes used throughout Japanese prefecture and district naming.
#
# Example outputs: Shin-o-kyo, Kita-no-hara, Higashi-ga-zaka, Nishi-machi.
#
# Add or remove fragments freely — more fragments = more variety.
# =============================================================================

[names]
prefix = [
    "Shin",    "Shiro",   "Kita",    "Minami",  "Higashi",
    "Nishi",   "Kami",    "Shimo",   "Furu",    "Ao",
    "Aka",     "Kuro",    "Yama",    "Kawa",    "Hana",
    "Tsuki",   "Hi",      "Umi",     "Mori",    "Saka",
]
middle = [
    "no",  "o",   "ga",  "na",  "i",
    "to",  "mi",  "se",  "ra",  "wa",
    "ko",  "ta",  "ku",  "ru",  "yo",
]
suffix = [
    "kyo",    "machi",   "hara",    "zaka",    "shima",
    "gawa",   "yama",    "mura",    "sato",    "hashi",
    "ji",     "oka",     "numa",    "bashi",   "cho",
    "dori",   "zaki",    "tani",    "shiro",   "dera",
]


# =============================================================================
# FEATURES
#
# Nodes are assigned features from three categories:
#   terrain  — exactly 1 per node (the fundamental landscape)
#   landmark — 0 or 1 per node (~60% chance)
#   modifier — 0 or 1 per node (~40% chance)
#
# Terrain reflects the physical geography of a dense Japanese prefecture —
# mountain ridges, river corridors, coastal zones, and layered urban fabric.
# Landmarks are the civic, spiritual, and institutional structures embedded
# in that geography. Modifiers reflect which institution or condition
# currently defines the character of the zone.
#
# Add or remove entries freely. More entries = more variety.
# =============================================================================

[features]
terrain = [
    "mountain_ridge",    "forested_slope",    "river_corridor",   "coastal_district",
    "urban_block",       "suburban_ward",     "underground_line", "elevated_highway",
    "reclaimed_bay",     "valley_floor",      "industrial_belt",  "park_greenway",
]
landmark = [
    "shrine",            "temple",            "broadcast_tower",  "suspension_bridge",
    "train_station",     "research_tower",    "underground_mall", "city_hall",
    "esper_test_site",   "power_substation",  "hospital_complex", "sports_dome",
]
modifier = [
    "school_controlled", "military_base",     "research_institute","contested",
    "government_held",   "underground_network","restricted_zone",  "civilian_dense",
    "abandoned",         "heavily_monitored", "esper_active",     "under_construction",
]

# Incompatible (category, value, category, value) pairs.
# The generator re-rolls if it draws an excluded combo.
# Format: each entry is [category_a, value_a, category_b, value_b]
# meaning "value_a in category_a is incompatible with value_b in category_b".
exclusions = [
    # Coastal terrain and mountain ridges are geographically exclusive
    ["terrain",  "mountain_ridge",    "terrain",   "coastal_district"],
    ["terrain",  "mountain_ridge",    "landmark",  "suspension_bridge"],
    ["terrain",  "mountain_ridge",    "landmark",  "underground_mall"],
    # Reclaimed bay is flat and artificial — no mountain features
    ["terrain",  "reclaimed_bay",     "terrain",   "mountain_ridge"],
    ["terrain",  "reclaimed_bay",     "terrain",   "forested_slope"],
    # Abandoned zones shouldn't also be civilian-dense
    ["modifier", "abandoned",         "modifier",  "civilian_dense"],
    # Restricted zones are not civilian-dense
    ["modifier", "restricted_zone",   "modifier",  "civilian_dense"],
    # An active esper test site is not under construction
    ["modifier", "esper_active",      "modifier",  "under_construction"],
    # Shrines and esper test sites are an unlikely pairing
    ["landmark", "shrine",            "modifier",  "esper_active"],
]

# The landmark guaranteed to appear on capital nodes.
# The faculty administration tower serves as the governing seat of the city's
# academic and research hierarchy.
[features.capital]
landmark = "faculty_administration_tower"


# =============================================================================
# RESOURCES
#
# *** PLACEHOLDER — the user will define these. ***
#
# Suggestions for the genre:
#   ability_data     — esper measurement and development records, high value
#   research_grant   — institutional funding, drives expansion
#   power_cell       — energy infrastructure, fuels facilities and tests
#   classified_file  — covert intelligence, leverage between factions
#
# Each node is assigned a random quantity in [0, max] for each resource type.
# Add or remove resource types freely — the sim treats them generically.
# =============================================================================

[resources]
ability_data    = 5
research_grant  = 4
power_cell      = 3
classified_file = 2