# =============================================================================
# themes/fantasy.toml — Fantasy theme data for history_engine.
#
# Loaded by worldgen.py via load_theme("fantasy").
# Adding a new theme requires only creating a new file here — no code changes.
#
# Sections:
#   [names]              — syllable pools for algorithmic name generation
#   [features]           — terrain / landmark / modifier pools
#   [features.exclusions]— incompatible (category, value, category, value) pairs
#   [features.capital]   — guaranteed landmark for capital nodes
#   [resources]          — resource names and maximum quantities per node
# =============================================================================


# =============================================================================
# NAME GENERATION
#
# Names are built by concatenating syllables:
#   prefix + middle (0–1) + suffix
#
# The generator picks one from each pool. Seed-deterministic.
# Add or remove fragments freely — more fragments = more variety.
# =============================================================================

[names]
prefix = [
    "Ash",  "Vel",  "Dusk", "Iron", "Thorn",
    "Mist", "Storm","Grim", "Ember","Frost",
    "Shad", "Bright","Raven","Hollow","Stone",
    "Wyr",  "Drake","Silver","Black","Dawn",
]
middle = [
    "en",  "ar",  "mor", "val", "kel",
    "an",  "eth", "or",  "un",  "il",
    "al",  "ir",  "on",  "yr",  "ath",
]
suffix = [
    "veil", "hold", "reach","fall", "keep",
    "gate", "moor", "dale", "spire","crest",
    "heim", "watch","mere", "ford", "mark",
    "haven","wound","deep", "glen", "ward",
]


# =============================================================================
# FEATURES
#
# Nodes are assigned features from three categories:
#   terrain  — exactly 1 per node (the fundamental landscape)
#   landmark — 0 or 1 per node (~60% chance)
#   modifier — 0 or 1 per node (~40% chance)
#
# Capital nodes always receive the capital landmark (see [features.capital]).
#
# Add or remove entries freely. More entries = more variety.
# =============================================================================

[features]
terrain = [
    "mountain",  "forest",   "plains",  "swamp",
    "desert",    "coast",    "tundra",  "canyon",
    "hills",     "river_valley", "volcanic", "steppe",
]
landmark = [
    "ruins",     "fortress", "shrine",   "bridge",
    "cave_system","watchtower","quarry",  "harbor",
    "monolith",  "graveyard","hot_springs","market_town",
]
modifier = [
    "fertile",    "barren",    "sacred",     "cursed",
    "isolated",   "war_scarred","overgrown", "mist_shrouded",
    "ancient",    "contested",  "rich_veins", "flooded",
]

# Incompatible (category, value, category, value) pairs.
# The generator re-rolls if it draws an excluded combo.
# Format: each entry is [category_a, value_a, category_b, value_b]
# meaning "value_a in category_a is incompatible with value_b in category_b".
# Add new exclusions freely. Keep it to genuinely nonsensical combos —
# weird-but-plausible pairings often produce the best narration.
exclusions = [
    # terrain        vs modifier
    ["terrain", "desert",    "modifier", "fertile"],
    ["terrain", "desert",    "modifier", "flooded"],
    ["terrain", "tundra",    "modifier", "fertile"],
    ["terrain", "tundra",    "modifier", "overgrown"],
    ["terrain", "swamp",     "modifier", "barren"],
    ["terrain", "volcanic",  "modifier", "fertile"],
    ["terrain", "volcanic",  "modifier", "flooded"],
    # terrain        vs landmark
    ["terrain", "desert",    "landmark", "harbor"],
    ["terrain", "tundra",    "landmark", "harbor"],
    ["terrain", "plains",    "landmark", "harbor"],
    ["terrain", "steppe",    "landmark", "harbor"],
    ["terrain", "mountain",  "landmark", "harbor"],
]

# The landmark guaranteed to appear on capital nodes.
[features.capital]
landmark = "fortress"


# =============================================================================
# RESOURCES
#
# Resource types present in this theme and the maximum quantity per node.
# Each node is assigned a random quantity in [0, max] for each resource type.
# Add or remove resource types freely — the sim treats them generically.
# =============================================================================

[resources]
grain  = 5
iron   = 4
timber = 3
gold   = 2