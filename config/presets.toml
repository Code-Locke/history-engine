# =============================================================================
# presets.toml — Universal presets for history_engine.
#
# Used by worldgen.py (personality archetypes) and narrator.py (styles).
# Theme-specific data (names, features, resources) lives in themes/<theme>.toml.
#
# Sections:
#   [personalities.<n>]       — personality archetype vectors (jittered at gen time)
#   [narrator_styles.<style>] — prompt text blocks for each narrator style
# =============================================================================


# =============================================================================
# PERSONALITY ARCHETYPES
#
# Each archetype defines a base personality vector. At generation time,
# each trait is jittered by ±jitter_range (defined in worldgen.py, default 0.1)
# and clamped to [0.0, 1.0].
#
# Add new archetypes freely. The generator picks from the full pool.
#
# Traits:
#   aggression   — weight toward Exterminate actions
#   expansionism — weight toward Explore + Expand actions
#   greed        — weight toward Exploit actions
#   paranoia     — pulls back from aggression when outnumbered
# =============================================================================

[personalities.warlord]
aggression   = 0.85
expansionism = 0.50
greed        = 0.25
paranoia     = 0.15

[personalities.conqueror]
aggression   = 0.70
expansionism = 0.80
greed        = 0.35
paranoia     = 0.25

[personalities.merchant]
aggression   = 0.15
expansionism = 0.40
greed        = 0.90
paranoia     = 0.50

[personalities.explorer]
aggression   = 0.20
expansionism = 0.90
greed        = 0.30
paranoia     = 0.30

[personalities.tyrant]
aggression   = 0.90
expansionism = 0.30
greed        = 0.70
paranoia     = 0.60

[personalities.diplomat]
aggression   = 0.10
expansionism = 0.50
greed        = 0.40
paranoia     = 0.70

[personalities.opportunist]
